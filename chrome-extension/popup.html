<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paywall Bypasser</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="icon">🔓</span>
                <h1>Paywall Bypasser</h1>
            </div>
        </header>

        <main class="main-content">
            <!-- Current Page Status -->
            <div class="status-section">
                <div class="status-card" id="currentPageStatus">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <div class="status-text">
                        <span id="statusText">Checking page...</span>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="actions-section">
                <button class="btn btn-primary" id="openArchiveBtn">
                    <span class="btn-icon">📄</span>
                    Open in Archive.ph
                </button>
                
                <button class="btn btn-secondary" id="checkArchiveBtn">
                    <span class="btn-icon">🔍</span>
                    Check if Archived
                </button>
            </div>

            <!-- Settings -->
            <div class="settings-section">
                <h3>Settings</h3>
                <div class="setting-item">
                    <label class="switch">
                        <input type="checkbox" id="autoRedirectToggle">
                        <span class="slider"></span>
                    </label>
                    <div class="setting-label">
                        <span>Auto-redirect to archive</span>
                        <small>Automatically redirect to archived version when paywall is detected</small>
                    </div>
                </div>
                
                <div class="setting-item">
                    <label class="switch">
                        <input type="checkbox" id="showNotificationsToggle">
                        <span class="slider"></span>
                    </label>
                    <div class="setting-label">
                        <span>Show notifications</span>
                        <small>Display notification when paywall is detected</small>
                    </div>
                </div>
            </div>

            <!-- Statistics -->
            <div class="stats-section">
                <h3>Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-number" id="totalDetected">0</span>
                        <span class="stat-label">Paywalls Detected</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="totalBypassed">0</span>
                        <span class="stat-label">Articles Accessed</span>
                    </div>
                </div>
            </div>

            <!-- Top Domains -->
            <div class="domains-section">
                <h3>Top Domains</h3>
                <div class="domains-list" id="domainsList">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="#" id="helpLink">Help</a>
                <a href="#" id="feedbackLink">Feedback</a>
            </div>
            <div class="version">v1.0</div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
